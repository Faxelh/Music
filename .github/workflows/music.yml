# Construit Music pour iPhone sur un Mac de GitHub, puis publie la mise à jour.
#
# Résultat : Music.ipa dans les artefacts ET dans « Releases » ; Music propose
# la nouvelle version toute seule (SideStore / AltStore, ou IPA pour Sideloadly).
# Les erreurs de compilation s'affichent en rouge sur la page de la construction.

name: Music – iPhone

on:
  push:
    branches: [main]
    paths-ignore:
      - "android/**"
      - "*.zip"
      - ".github/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

# Une nouvelle compilation arrête la précédente (pas de doublons).
concurrency:
  group: music-ipa
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Version automatique : Année.Mois.N — N = numéro de la mise à jour dans le mois
      # (1re mise à jour d'octobre 2026 → 2026.10.1, puis 2026.10.2…, et 2026.11.1 le mois suivant).
      # Numéro de compilation : minutes écoulées depuis 1970 (il augmente toujours).
      - name: Calculer la version
        shell: bash
        run: |
          ANNEE=$(date -u +%Y)
          MOIS=$(date -u +%-m)
          DEBUT=$(date -u +%Y-%m-01T00:00:00Z)
          # Chaque mise à jour envoyée (zip) est un commit : on compte ceux du mois en cours.
          N=$(git -C "$GITHUB_WORKSPACE" rev-list --count --since="$DEBUT" HEAD)
          [ "$N" -ge 1 ] 2>/dev/null || N=1
          echo "APP_VERSION=$ANNEE.$MOIS.$N" >> "$GITHUB_ENV"
          echo "APP_BUILD=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"
          echo "Version : $ANNEE.$MOIS.$N"


      - name: Code de Music
        shell: bash
        run: |
          set -euo pipefail
          # Le code est dans le dépôt (déballé depuis le zip par « Déballer le zip »).
          if [ -d patch ]; then cp -R patch/. .; fi
          ls ios ios/Sources

      - name: Projet Xcode
        shell: bash
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Compiler pour iPhone et créer Music.ipa
        shell: bash
        run: |
          # GitHub lance bash avec -e : on le retire pour pouvoir afficher les erreurs.
          set +e -u -o pipefail
          cd ios
          xcodebuild -project Music.xcodeproj -scheme Music -configuration Release -sdk iphoneos \
            -destination "generic/platform=iOS" -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$APP_BUILD" \
            build > ../xcodebuild.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            grep -E "error:" ../xcodebuild.log | sed "s#$GITHUB_WORKSPACE/##g" | sort -u | head -40 > ../erreurs.txt
            echo "===== ERREURS DE COMPILATION ====="
            cat ../erreurs.txt
            { echo "## Erreurs de compilation"; echo '```'; cat ../erreurs.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              echo "::error title=Compilation::${line:0:900}"
            done < ../erreurs.txt
            tail -n 80 ../xcodebuild.log
            exit 1
          fi
          APP=build/device/Build/Products/Release-iphoneos/Music.app
          test -d "$APP"
          rm -rf Payload ../Music.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry ../Music.ipa Payload
          ls -lh ../Music.ipa
          echo "- Music.ipa : $(du -h ../Music.ipa | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publier Music.ipa
        uses: actions/upload-artifact@v4
        with:
          name: Music-iPhone
          path: Music.ipa
          retention-days: 30

      # Publie l'IPA dans « Releases » (Music signale la nouvelle version) et met à jour
      # la source SideStore / AltStore pour les mises à jour automatiques.
      - name: Publier la mise à jour
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          NUMERO=$APP_BUILD
          if gh release view "ios-$NUMERO" --repo "$DEPOT" > /dev/null 2>&1; then
            echo "La version ios-$NUMERO est déjà publiée."; exit 0
          fi
          gh release create "ios-$NUMERO" Music.ipa \
            --repo "$DEPOT" --title "Music iPhone $APP_VERSION" \
            --notes "$(git log -1 --pretty=%s)" --target "${{ github.sha }}"
          TAILLE=$(stat -f%z Music.ipa)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE="https://github.com/$DEPOT/releases/download"
          mkdir -p maj
          cat > maj/source.json <<JSON
          {
            "name": "Music",
            "identifier": "com.faxel.music.source",
            "subtitle": "Lecteur de musique",
            "apps": [{
              "name": "Music",
              "bundleIdentifier": "com.faxel.music",
              "developerName": "Faxel Kwadio",
              "subtitle": "Lecteur de musique",
              "localizedDescription": "Lecteur de musique",
              "iconURL": "$BASE/ios-source/icone.png",
              "tintColor": "7C5CFF",
              "versions": [{
                "version": "$APP_VERSION",
                "buildVersion": "$NUMERO",
                "date": "$DATE",
                "downloadURL": "$BASE/ios-$NUMERO/Music.ipa",
                "size": $TAILLE,
                "minOSVersion": "16.0"
              }]
            }],
            "news": []
          }
          JSON
          cp "ios/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png" maj/icone.png
          gh release delete ios-source --repo "$DEPOT" --yes --cleanup-tag || true
          gh release create ios-source maj/source.json maj/icone.png \
            --repo "$DEPOT" --title "Source SideStore / AltStore" --latest=false \
            --notes "Ajoutez cette adresse dans SideStore ou AltStore : $BASE/ios-source/source.json"
          # On garde seulement les 5 dernières versions iPhone.
          gh release list --repo "$DEPOT" --limit 100 --json tagName -q '.[].tagName' \
            | grep -E '^ios-[0-9]+$' | sort -t- -k2 -n -r | tail -n +6 \
            | xargs -I{} gh release delete {} --repo "$DEPOT" --yes --cleanup-tag || true
          echo "- Publié : Music $APP_VERSION (ios-$NUMERO)" >> "$GITHUB_STEP_SUMMARY"
